[project]
name = "artify-bharat-backend"
version = "0.1.0"
description = "ArtifyBharat (SIH PS 26090) AI-Powered Digital Business Manager & Heritage Passport Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "celery>=5.4.0",
    "redis>=5.0.8",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=10.4.0",
    "opencv-python-headless>=4.10.0.84",
    "numpy>=1.26.4",
    "httpx>=0.27.0",
    "qrcode[pil]>=7.4.2",
    "xgboost>=2.1.0",
    "scikit-learn>=1.5.0",
    "aiofiles>=25.1.0",
    "alembic>=1.19.2",
    "requests>=2.34.2",
    "rembg[cpu]>=2.0.57",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402", "E741", "F401"]
