<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Artify</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #FFF8EF;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: #F97316;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: white;
      font-weight: 900;
    }
    h1 {
      color: #3B2418;
      font-size: 24px;
      margin: 0 0 10px;
    }
    p {
      color: #78716C;
      line-height: 1.6;
      margin: 0 0 20px;
    }
    .retry-btn {
      display: inline-block;
      background: #F97316;
      color: white;
      padding: 12px 24px;
      border-radius: 24px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.3s;
    }
    .retry-btn:hover {
      background: #EA580C;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">A</div>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. 
      Please check your network and try again.
    </p>
    <a href="/" class="retry-btn" onclick="window.location.reload(); return false;">
      Try Again
    </a>
  </div>
</body>
</html>
