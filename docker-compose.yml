# ==============================================================================
# WARNING: NOT VALID FOR PRODUCTION DEPLOYMENT (TARGET TBD — see docs/deployment-guide.md)
# ==============================================================================
# This docker-compose file represents a historical local development topology only.
# Currently, it cannot build out of the box because:
#   1) `./backend` was moved to `legacy/backend/` and is out of the active codebase.
#   2) `web-portal/` was permanently deleted in commit b0cece4 (now in frontend/).
# Production deployment infrastructure is TARGET TBD (deferred to #154).
# Do NOT use this file for production deployments.
# ==============================================================================

services:
  # --- PostgreSQL Database ---
  postgres:
    image: postgres:16-alpine
    container_name: artify_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: artify_bharat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Broker for Celery
  redis:
    image: redis:7-alpine
    container_name: artify_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # MinIO (Local S3 / Cloudflare R2 Mock)
  minio:
    image: minio/minio:latest
    container_name: artify_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # FastAPI Backend Service (Historical: ./backend moved to legacy/backend/)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: artify_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/artify_bharat
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - USE_MOCK_AI=True
      - SECRET_KEY=${SECRET_KEY:-artify_bharat_super_secret_jwt_key_2026_sih}
      - PII_VAULT_KEY=${PII_VAULT_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  # Celery Async Worker (CV, NLP, Transcription)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: artify_celery_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/artify_bharat
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - USE_MOCK_AI=True
      - SECRET_KEY=${SECRET_KEY:-artify_bharat_super_secret_jwt_key_2026_sih}
      - PII_VAULT_KEY=${PII_VAULT_KEY:-}
    depends_on:
      - backend
      - redis

  # Celery Beat (Daily Scraper Cron)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: artify_celery_beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis

  # Web Verification Portal (Historical: web-portal/ deleted in commit b0cece4; now under frontend/)
  web_portal:
    image: nginx:alpine
    container_name: artify_web_portal
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./web-portal/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
